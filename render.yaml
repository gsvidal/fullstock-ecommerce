services:
  - type: web
    name: fullstock-ecommerce
    runtime: node
    # Sin `plan`, Render elige uno pago.
    plan: free
    # La región de la base tiene que ser la misma: así se hablan por la red
    # interna de Render. No se puede cambiar después.
    region: virginia
    # El plan gratuito no tiene pre-deploy, así que las migraciones van acá: si
    # una falla, falla el build y la versión anterior sigue sirviendo. El seed
    # no carga nada si el catálogo ya existe.
    buildCommand: npm ci && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fullstock-ecommerce-db
          property: connectionString
      # Render lo genera una vez, al crear el servicio, y nadie lo ve.
      - key: SESSION_SECRET
        generateValue: true
      - key: VITE_SENTRY_DSN
        value: https://98c4de44edbe9fdb8667732dc157aac4@o4512245426618368.ingest.us.sentry.io/4512252024455168
      - key: SENTRY_DSN
        value: https://98c4de44edbe9fdb8667732dc157aac4@o4512245426618368.ingest.us.sentry.io/4512252024455168
      - key: APP_URL
        value: https://fullstock-ecommerce.onrender.com
      # Las credenciales de Mercado Pago no van en el repo: `sync: false` deja
      # la variable declarada y el valor se carga a mano en el dashboard.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: fullstock-ecommerce-db
    plan: free
    region: virginia
    # La misma versión que el CI (`postgres:16`) y que la base de desarrollo.
    postgresMajorVersion: "16"
